# See the pacman.conf(5) manpage for option and repository directives

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# Omarchy publishes aarch64 packages on the edge channel only. It comes first,
# unlike x86_64: it carries builds that must win over Arch Linux ARM's (Hyprland
# against the current aquamarine), exactly as the ISO resolved them.
[omarchy]
Server = https://pkgs.omarchy.org/edge/$arch

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist
